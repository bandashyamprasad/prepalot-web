# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Copy media to R2
# Owner, 16 Nov 2026: large media (interview audio) is served from the Cloudflare R2 bucket prepalot-media instead of
# the static assets, which are limited to 20,000 files. tools/r2_sync.py copies media/ in the repository to the bucket
# under the same paths (media/interview/audio/x.mp3 -> interview/audio/x.mp3); only new or changed files are sent.
# Runs on the laptop's runner (GitHub's own servers are not available on this account), with the standard library only.
# Secrets: R2_ACCOUNT_ID (the Cloudflare account id), R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token with
# Object Read and Write on prepalot-media).
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-sync
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Copy new and changed files
        uses: ./.github/actions/python-run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_STORE_MEDIA || secrets.R2_SECRET_ACCESS_KEY }}
        with:
          args: tools/r2_sync.py
