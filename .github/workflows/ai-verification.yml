# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: AI verification
on:
  # Twice a day (owner, 16 Nov 2026): 12:13 IST checks current affairs and exam dates, 00:13 IST also the question
  # bank (tools/ai_verification/auto.py, free chain); each batch starts the next one itself, and what passed in
  # current affairs and exam dates is published automatically (V94).
  # 17 Nov 2026: GitHub's own schedule never fired (the 00:13 IST start was missed), so Supabase starts it like the
  # other jobs (pg_cron prepalot-ai-verification-*, jobs-dispatch job ai_daily, which passes scheduled=1).
  workflow_dispatch:
    inputs:
      scheduled:
        description: "1 = the twice-daily automatic checks (what Supabase's schedule starts)"
        required: false
        default: ""
        type: string
      via:
        description: Who started it (manual, cloudflare or supabase)
        required: false
        default: manual
        type: string
      run_id:
        description: Saved administrator-created verification run UUID (empty = only fetch and index the private question bank)
        required: false
        default: ""
        type: string
permissions:
  contents: write  # 25 Nov 2026: the bank review writes status/bank-review.json for the admin page
  actions: write   # "Finish automatically" starts the next batch of the run itself
concurrency:
  group: ai-verification
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      # The master question bank comes from the repository's private-question-bank
      # branch (never deployed), fetched with this run's own token when it changed, so
      # nothing is copied or configured by hand. Repository variables AI_BANK_RELEASE /
      # AI_INVENTORY_PATH, if set, choose other folders.
      - name: Fetch the private question bank
        continue-on-error: true
        uses: ./.github/actions/python-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_BANK_RELEASE: ${{ vars.AI_BANK_RELEASE }}
          AI_INVENTORY_PATH: ${{ vars.AI_INVENTORY_PATH }}
          AI_VIEWER_DIR: ${{ vars.AI_VIEWER_DIR || (runner.os == 'Windows' && 'C:\Users\Shyam\Projects\examengine\Prepalot\questions\New Bank\latest' || '') }}
        with:
          args: -m tools.ai_verification.fetch_bank
      - name: Update the private question-bank index
        # 25 Nov 2026: skipped while the bank review is paused (it overloaded the free database; tools/ai_verification/auto.py hosted()).
        # 25 Nov 2026: the step itself now reads the on/off switch from /admin (auto.hosted()) and does nothing while it is off.
        if: ${{ env.AI_BANK_RELEASE != '' }}
        continue-on-error: true
        uses: ./.github/actions/python-run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIV_BANK_PAUSED: ${{ vars.AIV_BANK_PAUSED || '1' }}
        # Incremental: unchanged master files are not read again.
        with:
          args: -m tools.ai_verification.runner index --release "${{ env.AI_BANK_RELEASE }}" --inventory "${{ env.AI_INVENTORY_PATH }}"
      - name: Resume bounded verification batch
        if: ${{ inputs.run_id != '' }}
        uses: ./.github/actions/python-run
        env:
          AI_RUN_ID: ${{ inputs.run_id }}
          AIV_MODULES: ${{ vars.AIV_MODULES || 'ca,dates,bank' }}
          AIV_BANK_PAUSED: ${{ vars.AIV_BANK_PAUSED || '1' }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_JOURNAL_PATH: ${{ vars.AI_JOURNAL_PATH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_QUOTA_JOB: aiv
          # 25 Nov 2026: the list of bank items that passed review lives in the private R2 bucket (tools/ai_verification/ledger.py)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_STORE_MEDIA || secrets.R2_SECRET_ACCESS_KEY }}
        # Run UUID comes from an environment variable, never interpolated into shell source.
        with:
          args: -m tools.ai_verification.runner run
      - name: Start the day's scheduled checks (free models only)
        if: ${{ github.event_name == 'schedule' || (inputs.scheduled == '1' && (inputs.via == '' || inputs.via == 'manual' || inputs.via == vars.JOBS_SCHEDULER)) }}
        uses: ./.github/actions/python-run
        env:
          AIV_MODULES: ${{ vars.AIV_MODULES || 'ca,dates,bank' }}
          AIV_BANK_PAUSED: ${{ vars.AIV_BANK_PAUSED || '1' }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          args: -m tools.ai_verification.auto
