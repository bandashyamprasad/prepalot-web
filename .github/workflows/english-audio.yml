# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: English tests listening audio (Google Text-to-Speech)

# Synthesises the listening recordings for the IELTS-style and TOEFL-style tests with
# tools/english/build_audio.py and commits them under public/english/audio/. Google bills
# by characters: max_chars is the owner's limit for this run (Chirp 3 HD includes one
# million characters a month free). Run with dry_run first to see the count.
on:
  workflow_dispatch:
    inputs:
      max_chars:
        description: "Character limit for this run (required; set by the owner)"
        required: true
      redo:
        description: "Re-make recordings that already exist"
        type: boolean
        default: false
      only:
        description: "What to record: all, interview (interviewer voices and corporate speaking tasks) or interview-voices (interviewer voices only)"
        type: choice
        options: [all, interview, interview-voices]
        default: all
      voices:
        description: "Interviewer voices to record: in-f (Indian English female), in-m (Indian English male) or both"
        type: choice
        options: ["in-f,in-m", "in-f", "in-m"]
        default: "in-f,in-m"
      dry_run:
        description: "Only count the characters still to synthesise"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthesise
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python tools/english/build_audio.py --max-chars=${{ inputs.max_chars }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.redo && '--redo' || '' }} --only=${{ inputs.only }} --voices=${{ inputs.voices }}
      - name: Rebuild test files and save
        if: ${{ !inputs.dry_run }}
        run: |
          python tools/build_english_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/english public/corporate media/interview
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "English and corporate tests: recordings"
          # Page rebuilds outside the recording folders are not needed here (the site rebuilds
          # them), and leaving them would block the pull below; the recordings are committed.
          git reset --hard HEAD
          git clean -fdq public
          # Other work may be pushed while recordings are made: rebase onto it and try again.
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep $((attempt * 10))
            git pull --rebase --autostash --no-edit -X theirs origin ${{ github.ref_name }} || { git rebase --abort || true; exit 1; }
          done
          exit 1

      # Paid recordings are never lost: if saving to the repository fails, they stay
      # downloadable from the run page for 14 days.
      # Interview recordings are served from Cloudflare R2 (17 Nov 2026): send the new ones there too (a push made with
      # this run's token does not start r2-sync.yml).
      - name: Copy new interview recordings to R2
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_STORE_MEDIA || secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/r2_sync.py
      - name: Keep the recordings as a download
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: recordings
          path: |
            public/english/audio
            public/corporate/audio
            media/interview/audio
          retention-days: 14
          if-no-files-found: ignore
