# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Question bank writing (paid, capped)
# Writes question-bank questions with Claude (then OpenAI) under the owner's hard caps
# (tools/ai_spend/paid_generation.json: Claude 8 USD, OpenAI 17 USD in total), checks each batch blind
# on the free tiers, then reviews them on the free tiers. Results are pushed to main bank by bank.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted runner label to use (empty = the usual one; e.g. prepalot-pib to run in parallel, owner 22 Nov 2026)"
        required: false
        default: ""
        type: string
      steps:
        description: overnight.py steps, for example "run:gate_ee:4 verify:gate_ee:1"; empty = the next item of tools/qbank/queue.json
        required: false
        default: ""
        type: string
      chain:
        description: "1 = after this run, advance tools/qbank/queue.json and start the next run"
        required: false
        default: "0"
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: qbank-write-${{ inputs.runner || 'default' }}
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  write:
    if: github.ref == 'refs/heads/main'
    # Owner, 16 Nov 2026: bank writing runs for hours, so it gets its own runner (label prepalot-qbank, set the repository
    # variable QBANK_RUNNER=prepalot-qbank once it is installed) and no longer holds up current affairs, exam dates and
    # AI verification on prepalot-pib.
    # 21 Nov 2026: the prepalot-qbank runner did not come back after a power cut, so question-bank runs use the study
    # runner (its figure work is nearly done; the two take turns). Put back vars.QBANK_RUNNER once that runner is up.
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # 18 Nov 2026 13:26 IST: the PC's network dropped, GitHub ended the job, and none of its later steps ran. The
      # checkout below resets this workspace, so first push whatever the previous run saved to disk but never pushed.
      # 23 Nov 2026: the pre-checkout rescue step is gone: it ran the old save code left on the laptop's disk, which
      # pushed stale whole folders and deleted CLAT sets and approvals added on main since that checkout.
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
      - name: Write, check, review and push
        uses: ./.github/actions/python-run
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_QUOTA_JOB: qbank
          GIT_AUTHOR_NAME: prepalot-writer
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-writer
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          QBANK_STEPS: ${{ inputs.steps }}
        with:
          args: tools/qbank/run_steps.py
      - name: Push whatever is on disk (runs even after a cancel or a failure)
        if: always()
        uses: ./.github/actions/python-run
        env:
          GIT_AUTHOR_NAME: prepalot-writer
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-writer
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          QBANK_STEPS: ${{ inputs.steps || inputs.banks }}
        with:
          args: tools/qbank/push_saved.py
      - name: Start the next queued run (chain)
        if: always() && inputs.chain == '1'
        uses: ./.github/actions/python-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QBANK_JOB_STATUS: ${{ job.status }}
          QBANK_CHAIN_STOP: ${{ vars.QBANK_CHAIN_STOP || '0' }}
          GIT_AUTHOR_NAME: prepalot-writer
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-writer
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        with:
          args: tools/qbank/chain.py advance
