# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Verification model names and syllabus labels
on:
  workflow_run:
    workflows: ["Exam dates and official sources"]
    types: [completed]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-model-catalog
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Read model names (no generation or audit requests)
        uses: ./.github/actions/python-run
        with:
          args: -m tools.ai_verification.model_catalog
