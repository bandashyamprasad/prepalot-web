# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
# Daily health check of prepalot.in: key pages up and how fast, sitemap size, TLS certificate days left, next official
# exam dates. Results are committed to status/ in this repository (read by the site's admin page).
name: Site health check
on:
  workflow_run:
    workflows: ["Exam dates and official sources"]
    types: [completed]
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .tools
          sparse-checkout: tools/jobs/site_health.py
          sparse-checkout-cone-mode: false
      - name: Check the site
        id: check
        continue-on-error: true
        run: python3 .tools/tools/jobs/site_health.py .
      - name: Publish the result
        if: always()
        run: |
          git config user.name prepalot-health
          git config user.email actions@users.noreply.github.com
          git add status
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -q -m "Site health $(date -u +%Y-%m-%d): $(python3 -c "import json;d=json.load(open('status/health.json'));print('%d of %d pages up' % (d['pages_ok'], d['pages_checked']))")"
          git push -q
          # The admin page reads status/ through jsDelivr; clear its cache so the new result shows at once.
          for f in health.json surprises.jsonl; do curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/status/$f" || echo "jsDelivr purge failed for $f"; done
      - name: Fail when a page is down
        if: steps.check.outcome == 'failure'
        run: exit 1
