# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Specialist question banks (draft and check)

# Drafts the new LIC/RBI/SEBI subject banks (insurance, management, costing, Companies
# Act, economic and social issues, finance) with tools/bank/04_tools/generators/
# specialist/draft_bank.py: one model writes, a model from another provider answers each
# question blind, and only questions both agree on are kept. Each bank runs as its own
# job and commits its files under tools/bank/03_schema/authored/ (they take effect at
# the next bank build). Safe to re-run: finished topics are skipped.
on:
  workflow_dispatch:
    inputs:
      banks:
        description: "Banks to draft (JSON list): ins, mgt, cost, cla, esi, fin"
        default: '["ins","mgt","cost","cla","esi","fin"]'
      max_calls:
        description: "AI requests per bank (0 = until every topic is full)"
        default: "0"
      max_usd:
        description: "Spending cap per bank in US dollars (required; set by the owner)"
        required: true
      free_only:
        description: "Use only the free tiers (Gemini writes, Groq checks); no paid keys are passed"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        bank: ${{ fromJSON(inputs.banks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draft and check
        env:
          CLAUDE_API_KEY: ${{ !inputs.free_only && secrets.CLAUDE_API_KEY || '' }}
          OPENAI_API_KEY: ${{ !inputs.free_only && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SPEC_WRITE_MODELS: ${{ inputs.free_only && 'gemini:gemini-flash-latest,groq' || vars.SPEC_WRITE_MODELS }}
          SPEC_CHECK_MODELS: ${{ inputs.free_only && 'groq,gemini:gemini-flash-latest' || vars.SPEC_CHECK_MODELS }}
        run: python tools/bank/04_tools/generators/specialist/draft_bank.py ${{ matrix.bank }} --max-calls=${{ inputs.max_calls }} --max-usd=${{ inputs.max_usd }}
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/bank/03_schema/authored/${{ matrix.bank }}_*.txt
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Specialist bank ${{ matrix.bank }}: drafted and independently checked questions"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --no-edit origin main || { git rebase --abort; exit 1; }
          done
          exit 1
