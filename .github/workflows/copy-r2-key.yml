# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Give the Oracle PIB job the R2 store key (one tap, by hand)

# 26 Nov 2026: the Oracle machine reads official pages that do not answer GitHub's servers and stores them in the R2
# bucket prepalot-store for the exam-dates run. The private repository's own R2 key cannot use that bucket (R2 answers
# AccessDenied), so nothing was ever stored. This copies the three R2 secrets that already work here to the private
# repository, sealed for GitHub; it prints secret names only, never a value. Run it once, by hand. Nothing else
# starts it.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            tools/jobs/copy_secrets.js
          sparse-checkout-cone-mode: false
      - name: Copy R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY_STORE_MEDIA to the private repository
        env:
          COPY_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TARGET_REPO: bandashyamprasad/prepalot
          ONLY: R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY_STORE_MEDIA
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: "{}"
        run: |
          npm install --prefix "$RUNNER_TEMP/sodium" --no-audit --no-fund --silent libsodium-wrappers@0.7.15
          NODE_PATH="$RUNNER_TEMP/sodium/node_modules" node tools/jobs/copy_secrets.js
