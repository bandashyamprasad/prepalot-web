# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Interview tracks (paid, capped)
# Writes the interview-practice tracks for the exams added in November 2026 (tools/interview/new_tracks.json:
# medical school MMI after UCAT, US college admission after SAT/ACT, law school after LSAT, PhD/JRF after
# CSIR NET or GATE), or adds questions to an existing track, on OpenRouter under a hard cap. The owner starts
# it by hand (planned for 1 December 2026). Each track is pushed to main as it finishes; at the end the
# interview pages are rebuilt and pushed, which deploys the site. See tools/interview/generate.py.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "new = every track in new_tracks.json up to its size; or 'new <track>'; or 'topup <track> <n>'"
        required: true
        default: "new"
        type: string
      max_usd:
        description: "Hard spending cap for this run in US dollars (the run stops before passing it)"
        required: true
        default: "2"
        type: string
      dry_run:
        description: "Only print the plan; no AI calls"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: interview-content
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
      - name: Write, check and push the interview tracks
        uses: ./.github/actions/python-run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GIT_AUTHOR_NAME: prepalot-writer
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-writer
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        with:
          args: tools/interview/generate.py --max-usd=${{ inputs.max_usd }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.command }}
