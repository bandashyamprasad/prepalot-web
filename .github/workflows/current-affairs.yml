# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Current affairs

# Full runs at 06:00 and 21:00 IST (00:30 and 15:30 UTC): fetch, draft, verify, write
# proposals to /admin/#ca, then publish whatever is approved.
# Every 2 hours a cheap collect run reads the feeds into the inbox (the PIB feed shows only
# its latest 20 releases) and, if the owner has approved anything that is not yet
# published, publishes it. So "Publish" on the admin page goes live within about 2 hours,
# or at once when the optional ca-dispatch Edge Function starts the "publish" mode below.
# WHERE IT RUNS: the repository variable JOBS_RUNNER picks the machine. Not set (or "computer"):
# the GitHub runner on the owner's computer (labels self-hosted, prepalot-pib), which costs no
# GitHub minutes; a run waits in the queue while the computer is off and starts when it is on.
# "github": GitHub's own servers (uses the account's Actions minutes). /admin shows the choice.
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 15 * * *"
    - cron: "10 */2 * * *"
  workflow_dispatch:
    inputs:
      via:
        description: "Who started it: manual (you, or a Run now button) always runs; cloudflare / supabase are their schedules and run only when the repository variable JOBS_SCHEDULER names them"
        type: choice
        default: manual
        options: [manual, cloudflare, supabase]
      mode:
        description: "full = fetch, draft, verify, propose, publish approved; collect = fetch, publish approved; publish = publish approved only; dry-run = offline test with saved samples"
        type: choice
        default: full
        options: [full, collect, publish, dry-run]

permissions:
  contents: write
  actions: write   # starts the offline question-bank rebuild after a publish

concurrency:
  group: current-affairs
  cancel-in-progress: false

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  run:
    # Hard kill switch: setting the repository variable CA_PIPELINE_ENABLED to "false"
    # stops every run. Day to day, the switches on /admin/#ca decide what runs.
    # WHO STARTS IT: the repository variable JOBS_SCHEDULER (github when not set, cloudflare, supabase
    # or pc) picks the one scheduler whose timed runs go ahead; the others are skipped at once and use
    # no minutes. Runs you start by hand or from a Run now button on /admin always go ahead.
    if: ${{ (vars.CA_PIPELINE_ENABLED != 'false' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')) && ((github.event_name == 'schedule' && (vars.JOBS_SCHEDULER == '' || vars.JOBS_SCHEDULER == 'github')) || (github.event_name == 'workflow_dispatch' && (inputs.via == '' || inputs.via == 'manual' || inputs.via == vars.JOBS_SCHEDULER)) || (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '10 */2 * * *' && 'collect' || 'full') }}
      # The Supabase values are left out of a dry run, so a test can never write to the live tables.
      SUPABASE_URL: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && secrets.SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      CA_PIPELINE_ENABLED: ${{ vars.CA_PIPELINE_ENABLED }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CA_DRAFT_MODELS: ${{ vars.CA_DRAFT_MODELS }}
      CA_VERIFY_MODELS: ${{ vars.CA_VERIFY_MODELS }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      CA_MAX_ITEMS: ${{ vars.CA_MAX_ITEMS }}
      # On the owner's computer PIB is read in this same run (PIB refuses GitHub's servers);
      # on GitHub's servers PIB is left to current-affairs-pib.yml on the computer.
      CA_SKIP_FEEDS: ${{ vars.JOBS_RUNNER == 'github' && vars.CA_PIB_ON_COMPUTER == 'true' && 'pib_en,pib_hi' || '' }}
      CA_PIB_BROWSER: ${{ vars.JOBS_RUNNER != 'github' && '1' || '' }}
      CA_CURL_FALLBACK: ${{ vars.JOBS_RUNNER != 'github' && '1' || '' }}
      CA_RUNNER: ${{ vars.JOBS_RUNNER == 'github' && 'GitHub servers' || 'your computer' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
      - name: Restore the inbox
        uses: actions/cache/restore@v4
        with:
          path: tools/ca/work/inbox.json
          key: ca-inbox-${{ github.run_id }}
          restore-keys: ca-inbox-
      - name: Run current affairs (read, draft, check, publish approved, save)
        uses: ./.github/actions/python-run
        with:
          args: tools/jobs/current_affairs.py
      - name: Save the inbox
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/ca/work/inbox.json
          key: ca-inbox-${{ github.run_id }}

  # 25 Nov 2026: GitHub fired the hourly PIB trigger (prepalot-web pib-trigger.yml) only about twice in nine hours,
  # while the Supabase timer starts this workflow every 2 hours without fail. So every collect or full run here also
  # asks the private repository to run the PIB job on the Oracle machine (PIB refuses GitHub's servers). It runs after
  # the job above whatever its result, and fails loudly when GitHub refuses the request. pib-trigger.yml stays as a
  # backup; the PIB job keeps one run at a time, so two requests close together do not double up.
  pib:
    needs: run
    if: ${{ always() && needs.run.result != 'skipped' && github.repository == 'bandashyamprasad/prepalot-web' && !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'publish')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Ask the private repository to run the PIB job
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bandashyamprasad/prepalot/dispatches \
            -d '{"event_type":"pib"}')
          echo "GitHub answered HTTP $code"
          if [ "$code" != "204" ]; then cat /tmp/out.txt; echo "::error::PIB dispatch failed (HTTP $code)"; exit 1; fi
