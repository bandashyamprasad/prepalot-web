# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Deploy Supabase functions

# Run by hand from the Actions tab (Run workflow). It deploys
# supabase/functions/support-ticket and supabase/functions/ca-dispatch ("Publish now"
# on /admin/#ca) to the Prepalot Supabase project.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase dashboard >
# Account > Access Tokens > Generate new token).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add the SUPABASE_ACCESS_TOKEN repository secret first." >&2
            exit 1
          fi
          # The function checks callers itself (admin_whoami, forms), so it is
          # deployed without the gateway JWT check, as it was before.
          supabase functions deploy support-ticket --project-ref atpelambkmpakdlkqefg --no-verify-jwt
          # ca-dispatch also checks the caller itself (signed-in administrator only).
          supabase functions deploy ca-dispatch --project-ref atpelambkmpakdlkqefg --no-verify-jwt
          # Also checks the same admin allowlist; dispatches only a saved manual AI run.
          supabase functions deploy ai-verification-dispatch --project-ref atpelambkmpakdlkqefg --no-verify-jwt
          # Study-chapter run reports by email; checks the caller itself (service key only).
          supabase functions deploy study-report --project-ref atpelambkmpakdlkqefg --no-verify-jwt
