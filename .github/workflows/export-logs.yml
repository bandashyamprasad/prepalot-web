# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
# Owner, 23 Nov 2026: this repository is public, so every finished run's log is copied to the private R2 bucket
# (prepalot-store, logs/) and the run, with its log, is then deleted from GitHub.
name: Export and delete run logs
on:
  workflow_run:
    workflows: ["Current affairs", "Exam dates and official sources", "AI verification", "Study chapters (free tiers)", "Question bank writing (paid, capped)", "Site health check", "Copy media to R2"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write   # 25 Nov 2026: keeps status/jobs.json (each job's last result) for the admin page
concurrency:
  group: export-logs
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            tools/jobs/export_logs.py
            tools/r2_sync.py
          sparse-checkout-cone-mode: false
      - name: Copy finished runs' logs to R2, then delete the runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN: ${{ github.run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_STORE_MEDIA || secrets.R2_SECRET_ACCESS_KEY }}
          CONTENT_REPO: bandashyamprasad/prepalot
          CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 tools/jobs/export_logs.py
