# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Question bank review (free models)
# Second, independent review of question-bank questions on the free tiers: Groq first, Gemini when
# Groq refuses. Failures go to tools/bank/03_schema/qbank_excluded_auto.json (left out of the site at
# the next build); reasons in tools/qbank/state/<bank>/verify.jsonl. Both are pushed back to main.
on:
  workflow_dispatch:
    inputs:
      banks:
        description: Banks to review, space-separated (for example "gate_ga gate_cs")
        required: true
        default: gate_ga
        type: string
      generated_only:
        description: Only the generated figure questions (*.gen.jsonl)
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: qbank-review
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
      - name: Review and push the results
        uses: ./.github/actions/python-run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # paid last resort, capped by tools/ai_spend/paid_review.json
          GIT_AUTHOR_NAME: prepalot-review
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-review
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          REVIEW_BANKS: ${{ inputs.banks }}
          REVIEW_GENERATED: ${{ inputs.generated_only }}
        with:
          args: tools/qbank/review_free.py
      - name: Push whatever is on disk (runs even after a cancel or a failure)
        if: always()
        uses: ./.github/actions/python-run
        env:
          GIT_AUTHOR_NAME: prepalot-writer
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-writer
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          QBANK_STEPS: ${{ inputs.steps || inputs.banks }}
        with:
          args: tools/qbank/push_saved.py
