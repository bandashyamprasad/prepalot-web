# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Study chapters (free tiers)
# Full subject chapters for NEET PG / FMGE (and later GATE): Gemini (AI Studio free tier) drafts, Groq
# (free tier) checks part by part; only chapters that pass are published. No paid API is used (owner,
# 11 Nov 2026). Runs on the owner's computer (timer every 2 hours, and each run starts the next while work remains) (self-hosted runner, no GitHub minutes), saves and pushes
# after every chapter, and stops by itself at the free-tier limits; the next run carries on.
on:
  schedule:
    - cron: "17 6 * * *"   # 21 Nov 2026: once a day (11:47 IST) while the question bank uses this runner (was hourly)
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted runner label to use (empty = the usual one; e.g. prepalot-pib to run in parallel, owner 22 Nov 2026)"
        required: false
        default: ""
        type: string
      set:
        description: "Which outline: empty = the CHAPTER_SET variable (else all); all, med, or one gate-xx"
        default: ""
      subjects:
        description: "Subject ids separated by spaces (empty = all, in order), e.g. pathology pharmacology"
        default: ""
      max_chapters:
        description: "Most chapters this run"
        default: "400"
permissions:
  contents: write
  actions: write
concurrency:
  group: study-chapters-${{ inputs.runner || 'default' }}
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1380
    steps:
      # 17 Nov 2026 night: the checkout below resets this workspace; first push anything the previous run could not save
      # (only when the workspace's own code knows --rescue, so an older copy never starts a full run here).
      - name: Save what the previous run left
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          if not exist tools\study\run_chapters.py exit /b 0
          findstr /c:"--rescue" tools\study\run_chapters.py >nul || exit /b 0
          py -3 tools\study\run_chapters.py --rescue || python tools\study\run_chapters.py --rescue
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
      - name: Write, check, publish and push
        uses: ./.github/actions/python-run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_CHAPTERS_KEY: ${{ secrets.GEMINI_CHAPTERS_KEY }}
          GEMINI_CHAPTERS_KEY_2: ${{ secrets.GEMINI_CHAPTERS_KEY_2 }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_QUOTA_JOB: study
          GOEDEL_API_KEY: ${{ secrets.GOEDEL_API_KEY }}
          # run reports by email (tools/study/report.py, Supabase function study-report)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_GITHUB }}
          # Owner, 11 Nov 2026: a paid OpenRouter model writes, free models check. The key's credit limit caps spend;
          # set the repository variable CHAPTER_PAID_WRITER to another family name to change it, or to "none" to stop.
          CHAPTER_PAID_WRITER: ${{ vars.CHAPTER_PAID_WRITER || 'deepseek/deepseek-v4.1-flash' }}
          # Owner, 12 Nov 2026: a paid model of another family checks each whole chapter (Groq stays free for second opinions).
          CHAPTER_NO_GEMINI: ${{ vars.CHAPTER_NO_GEMINI || '1' }}
          CHAPTER_PAID_CHECKER: ${{ vars.CHAPTER_PAID_CHECKER || 'minimax/minimax-m3.1-flash' }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          # 17 Nov 2026: repository variable CHAPTER_SET picks the outline for every run, restarts included (owner: NEET PG first)
          CHAPTER_SET: ${{ inputs.set || vars.CHAPTER_SET || 'all' }}
          CHAPTER_SUBJECTS: ${{ inputs.subjects || '' }}
          CHAPTER_MAX: ${{ inputs.max_chapters || '400' }}
          CHAPTER_WORKERS: ${{ vars.CHAPTER_WORKERS || '64' }}
          GIT_AUTHOR_NAME: prepalot-writer
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: prepalot-writer
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        with:
          args: tools/study/run_chapters.py
      - name: Start the next run when work remains
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHAPTER_NO_RESTART: ${{ vars.CHAPTER_NO_RESTART || '0' }}
          CHAPTER_JOB_STATUS: ${{ job.status }}
        with:
          args: tools/study/restart.py
