# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: AI verification trial (manual)

# Small trial runs of the AI verification with each paid provider: current affairs,
# exam information and the question bank, each with Claude and with OpenAI
# (tools/ai_verification/trial.py). Each run has a small budget and is recorded like an
# admin-started run, so its results, token usage and cost show in /admin/#verification.
# Runs on the owner's computer (the private question-bank inventory lives there).
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "module:provider:model, comma separated (empty = all six)"
        required: false
        type: string
      budget:
        description: "Budget per trial run in US dollars"
        required: false
        default: "0.40"
        type: string
      items:
        description: "Proposals per current-affairs / exam-information trial (up to 100)"
        required: false
        default: "3"
        type: string
      fallback:
        description: "Continue with the next provider when one runs out (off = test each provider on its own)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ai-verification
  cancel-in-progress: false
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      # The master question bank comes from the repository's private-question-bank
      # branch (never deployed), fetched with this run's own token when it changed, so
      # nothing is copied or configured by hand. Repository variables AI_BANK_RELEASE /
      # AI_INVENTORY_PATH, if set, choose other folders.
      - name: Fetch the private question bank
        continue-on-error: true
        uses: ./.github/actions/python-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_BANK_RELEASE: ${{ vars.AI_BANK_RELEASE }}
          AI_INVENTORY_PATH: ${{ vars.AI_INVENTORY_PATH }}
          AI_VIEWER_DIR: ${{ vars.AI_VIEWER_DIR || (runner.os == 'Windows' && 'C:\Users\Shyam\Projects\examengine\Prepalot\questions\New Bank\latest' || '') }}
        with:
          args: -m tools.ai_verification.fetch_bank
      - name: Update the private question-bank index
        if: ${{ env.AI_BANK_RELEASE != '' }}
        continue-on-error: true
        uses: ./.github/actions/python-run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Incremental: unchanged master files are not read again.
        with:
          args: -m tools.ai_verification.runner index --release "${{ env.AI_BANK_RELEASE }}" --inventory "${{ env.AI_INVENTORY_PATH }}" --publish-catalog
      - name: Trial runs
        uses: ./.github/actions/python-run
        env:
          AI_TRIALS: ${{ inputs.trials }}
          AI_TRIAL_BUDGET: ${{ inputs.budget }}
          AI_TRIAL_ITEMS: ${{ inputs.items }}
          AI_TRIAL_FALLBACK: ${{ inputs.fallback && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_JOURNAL_PATH: ${{ vars.AI_JOURNAL_PATH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          args: -m tools.ai_verification.trial
