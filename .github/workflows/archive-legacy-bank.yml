# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Archive earlier mock reviews

# Run by hand from the Actions tab (Run workflow). It saves, for every attempt
# made by the earlier CAT engine, what that attempt's review needs, into
# public/_private/legacy/ (served only through the Worker, never to browsers),
# and commits the files to main. Needs the repository secrets SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY. Reads Supabase; changes nothing there.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-legacy-bank
  cancel-in-progress: false

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/legacy/archive_legacy.py
      - name: Commit
        run: |
          git config user.name "prepalot-archive"
          git config user.email "actions@users.noreply.github.com"
          git add public/_private/legacy
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
          else
            git commit -m "Archive earlier mock reviews"
            git push
          fi
