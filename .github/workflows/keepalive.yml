# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
# GitHub turns off scheduled workflows in a public repository after 60 days without a commit. Once a month, only if
# this repository had no commit for 45 days, this refreshes .github/last-check with the date.
name: Monthly check
on:
  schedule:
    - cron: "9 5 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh only when the repository has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -lt 45 ]; then echo "Recent commit; nothing to do."; exit 0; fi
          date -u +%Y-%m-%d > .github/last-check
          git config user.name prepalot-bot
          git config user.email actions@users.noreply.github.com
          git add .github/last-check
          git commit -m "Monthly check"
          git push
