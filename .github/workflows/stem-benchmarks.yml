# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Stem benchmarks (NEET and JEE questions through the APIs)

# Runs tools/stem/api_pipeline.py: a blind check by a second model (OpenAI) of the questions written
# for the NEET UG, JEE Main, JEE Advanced, B.Arch and B.Planning benchmark mocks, Claude's ruling on
# every disagreement, replacement of near-copies across papers, and writing of missing questions.
# Every run is capped: max_usd per command, and in total the budgets below (spend so far is kept in
# tools/stem/logs/spend.json). Changes are committed under tools/stem/; the papers are built from
# them with tools/stem/build_stem_benchmarks.py.
on:
  workflow_dispatch:
    inputs:
      commands:
        description: "Commands, separated by ';' (e.g. check neet-ug_physics_p1-2 neet-ug_physics_p3-4; dedupe neet-ug)"
        required: true
      max_usd:
        description: "Spending cap per command in US dollars"
        required: true
        default: "3"
      claude_budget_usd:
        description: "Total Claude budget across all runs (US dollars)"
        default: "40"
      openai_budget_usd:
        description: "Total OpenAI budget across all runs (US dollars)"
        default: "25"
      writer:
        description: "Who writes questions and rules on disagreements: claude (Claude Sonnet) or openai (GPT-5.4, used while the Claude API limit is reached)"
        type: choice
        options: [claude, openai]
        default: claude

permissions:
  contents: write

# No concurrency group: GitHub keeps only one waiting run per group and cancels the others.
# Runs can overlap safely: each writes its own log files (tools/stem/logs/*/<run id>.json).
env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Start from the latest main
        run: git pull --rebase --no-edit origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the commands
        # Stops before the job's own limit so the Save step always has time to commit what was written.
        timeout-minutes: 320
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_BUDGET_USD: ${{ inputs.claude_budget_usd }}
          OPENAI_BUDGET_USD: ${{ inputs.openai_budget_usd }}
          COMMANDS: ${{ inputs.commands }}
          MAX_USD: ${{ inputs.max_usd }}
          STEM_WRITE_MODEL: ${{ inputs.writer == 'openai' && 'gpt-5.4' || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          IFS=';' read -ra CMDS <<< "$COMMANDS"
          for c in "${CMDS[@]}"; do
            c="$(echo "$c" | xargs)"
            [ -z "$c" ] && continue
            echo "::group::$c"
            # shellcheck disable=SC2086
            python tools/stem/api_pipeline.py $c --max-usd="$MAX_USD" || echo "command failed: $c"
            echo "::endgroup::"
          done
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/stem/src tools/stem/logs tools/guides tools/interview/src
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Stem benchmarks: API check and writing (${{ inputs.commands }})"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            # This run's question changes win over older copies of the same files.
            git pull --rebase --no-edit -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
