# Generated by tools/jobs/make_public_workflows.py in the private repository; edit it there.
name: Exam dates and official sources

# Every day at 07:00 IST (01:30 UTC), and on demand from the Actions tab.
# tools/monitor_exam_dates.py
#   * applies the exam-date changes the owner approved on /admin/#dates,
#   * moves an exam to its next cycle ("To be announced") the day after its
#     last exam day, keeping the finished date for the 30-day clean-up,
#   * reads the official sources, lists changed pages and new official dates
#     on /admin/#dates for approval (nothing goes live without approval),
#   * reports the whole run to the database for the admin page.
# AI use stays inside the free limits: at most 10 Gemini questions a run, and
# only for exams whose dates are not announced or whose official page changed;
# Groq is a fallback for at most 3 short questions. When exam-cycles.json
# changes, the sitemaps are rebuilt and both are pushed to main, which
# redeploys the site (countdowns, cycle clean-up and sitemaps follow).
# WHERE IT RUNS: the repository variable JOBS_RUNNER picks the machine. Not set (or "computer"):
# the GitHub runner on the owner's computer (labels self-hosted, prepalot-pib), which costs no
# GitHub minutes; a run waits in the queue while the computer is off and starts when it is on.
# "github": GitHub's own servers (uses the account's Actions minutes). /admin shows the choice.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      via:
        description: "Who started it: manual (you, or a Run now button) always runs; cloudflare / supabase are their schedules and run only when the repository variable JOBS_SCHEDULER names them"
        type: choice
        default: manual
        options: [manual, cloudflare, supabase]

permissions:
  contents: write

concurrency:
  group: exam-dates
  cancel-in-progress: false

env:
  CONTENT_REPO: bandashyamprasad/prepalot
  CONTENT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
jobs:
  check:
    # WHO STARTS IT: the repository variable JOBS_SCHEDULER (github when not set, cloudflare, supabase
    # or pc) picks the one scheduler whose timed runs go ahead; the others are skipped at once and use
    # no minutes. Runs you start by hand or from a Run now button on /admin always go ahead.
    if: ${{ ((github.event_name == 'schedule' && (vars.JOBS_SCHEDULER == '' || vars.JOBS_SCHEDULER == 'github')) || (github.event_name == 'workflow_dispatch' && (inputs.via == '' || inputs.via == 'manual' || inputs.via == vars.JOBS_SCHEDULER)) || (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATES_AI_MODELS: ${{ vars.DATES_AI_MODELS }}
      GEMINI_MODEL: ${{ vars.EXAM_DATES_GEMINI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATES_RUNNER: ${{ vars.JOBS_RUNNER == 'github' && 'GitHub servers' || 'your computer' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bandashyamprasad/prepalot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
      - name: Check official sources, apply approved dates, rebuild and save
        uses: ./.github/actions/python-run
        with:
          args: tools/jobs/exam_dates.py
      - name: Attach failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: exam-dates-failure-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/data/monitor_failure.json
            tools/data/monitor_report.md
          if-no-files-found: warn
          retention-days: 14
